<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Headerwise</title>
  <meta name="description" content="Modify HTTP request and response headers in Chrome and Edge. Import your ModHeader profiles. Runs locally, sends nothing anywhere." />
  <link rel="icon" href="icon-128.png" />
  <style>
    :root { color-scheme: light dark; --bg: #ffffff; --fg: #1f2328; --muted: #57606a; --accent: #2563eb; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1f2023; --fg: #e8e8ea; --muted: #a8adb5; --accent: #7aa7ff; } }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.6 system-ui, -apple-system, 'Segoe UI', sans-serif; }
    main { max-width: 680px; margin: 0 auto; padding: 56px 16px; }
    img { width: 64px; height: 64px; }
    h1 { font-size: 34px; margin: 12px 0 8px; }
    p { color: var(--muted); }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <img src="icon-128.png" alt="" />
    <h1>Headerwise</h1>
    <p>Modify HTTP request and response headers in Chrome and Edge. Import your ModHeader profiles. Runs locally, sends nothing anywhere.</p>
    <p><a href="privacy.html">Privacy</a> · <a href="https://github.com/Protemir/headerwise">Source and issues</a></p>
  </main>
</body>
</html>
