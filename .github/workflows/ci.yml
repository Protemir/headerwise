name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Package
        run: cd dist && zip -qr ../headerwise.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: headerwise
          path: headerwise.zip
