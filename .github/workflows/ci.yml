name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:firefox
      - name: Package
        run: cd dist && zip -qr ../headerwise.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: headerwise
          path: headerwise.zip
      - uses: actions/upload-artifact@v4
        with:
          name: headerwise-firefox
          path: headerwise-firefox-*.zip
      # The lockfile npm resolved here, so builds can be reproduced (AMO asks for it).
      - uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json

  # The automation build, driven by the real tools people use it with.
  automation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      # Signs headerwise-automation.crx with the key behind the fixed id (a repo secret).
      - run: npm run build && npm run build:automation
        env:
          HW_AUTOMATION_KEY: ${{ secrets.AUTOMATION_KEY }}
      - run: npm i --no-save --no-audit --no-fund playwright puppeteer selenium-webdriver chrome-modheader
      - run: npx playwright install --with-deps chromium
      - run: pip install selenium
      # Ubuntu 24.04 blocks the user namespaces Chrome's sandbox needs; Playwright
      # turns the sandbox off itself, Chrome for Testing does not.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: node scripts/automation-smoke/playwright.mjs
        if: success() || failure()
      - run: node scripts/automation-smoke/puppeteer.mjs
        if: success() || failure()
      - run: node scripts/automation-smoke/selenium.mjs
        if: success() || failure()
      - run: python scripts/automation-smoke/selenium_smoke.py
        if: success() || failure()
      # Needs the signed .crx, which forks can't build (no key): skipped there.
      - run: node scripts/automation-smoke/modheader-compat.mjs
        if: (success() || failure()) && hashFiles('headerwise-automation.crx') != ''
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: headerwise-automation
          path: |
            headerwise-automation.zip
            headerwise-automation.crx
